name: Weekly Drift Check

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  drift_check:
    name: Detect Feature Drift
    runs-on: ubuntu-latest
    outputs:
      drift_detected: ${{ steps.drift.outputs.drift_detected }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run drift detection
        id: drift
        run: |
          set +e
          python -m training.drift
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Drift detected — retraining pipeline will be triggered."
          else
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "No significant drift detected. Model remains current."
          fi

      - name: Upload drift history artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-history-${{ github.run_id }}
          path: artifacts/drift_history.json
          retention-days: 90

  trigger_retrain:
    name: Trigger Retraining (if drift detected)
    needs: drift_check
    if: needs.drift_check.outputs.drift_detected == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger retrain workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'retrain.yml',
              ref: 'main',
              inputs: {
                drift_triggered: 'true'
              }
            });
            console.log('✓ retrain.yml dispatched successfully.');